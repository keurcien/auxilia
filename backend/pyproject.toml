[project]
name = "backend"
version = "0.5.5"
description = "auxilia backend — FastAPI service for hosting MCP-powered AI assistants"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15.0",
    "anyio>=4.5.0",
    "fastapi>=0.121.1",
    "greenlet>=3.1.1",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2.12",
    "redis>=5.2.0",
    "sqlmodel>=0.0.27",
    "python-jose[cryptography]>=3.3.0",
    "pydantic[email]>=2.12.4",
    "authlib>=1.6.6",
    "pwdlib[argon2]>=0.3.0",
    "langchain-google-genai>=4.3.5",
    "itsdangerous>=2.2.0",
    # >=1.3.16: upstream ToolErrorMiddleware + ModelRetryMiddleware that
    # classifies via the typed ModelError hierarchy (providers >=1.6 raise it).
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "mcp>=1.26.0",
    "slack-sdk>=3.34.0",
    "aiohttp>=3.13.3",
    "langfuse>=4.14.4",
    "h2>=4.3.0",
    "deepagents>=0.5.6",
    "opensandbox>=0.1.6",
    "jsonschema>=4.26.0",
    "croniter>=6.2.3",
    "pyyaml>=6.0.3",
    "google-cloud-storage>=3.13.0",
    "google-auth>=2.50.0",
    "daytona>=0.205.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "pytest-mock>=3.14.0",
    "fakeredis[lua]>=2.36.2",
    "aiosqlite>=0.22.1",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
]

[tool.ruff]
indent-width = 4
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
    "ASYNC",  # flake8-async: blocking calls on the event loop
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "BLE001", # blind `except Exception` — must be deliberate and annotated
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "UP042", # StrEnum has subtly different __str__ behavior; keep (str, Enum)
    # Comments and docstrings deliberately use typographic characters (— × ›).
    "RUF001",
    "RUF002",
    "RUF003",
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["fastapi", "sqlmodel", "psycopg", "redis", "langchain", "langgraph", "langfuse", "langchain-anthropic", "langchain-google-genai", "langchain-mcp-adapters", "langchain-openai", "langchain-deepseek"]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are injected by name and are often present only for their
# side effects (auth overrides, DB session), so they read as "unused args".
"tests/**" = ["ARG001"]

[tool.mypy]
# Deliberately non-strict: the value here is catching the mistakes the generics in
# `app/repository.py` / `app/service.py` were meant to catch and currently can't
# (nothing type-checked this codebase before), not annotating every function.
# Tighten per-module as modules get cleaned up — see backend-cleanup-todo.md P0-3.
python_version = "3.11"
files = ["app"]
exclude = "^alembic/"
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

# On by default at this strictness.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = false

# Off for now: turning these on floods the report before the Phase 3 cleanups.
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
# Third-party packages without (or with incomplete) type information.
module = [
    "authlib.*",
    "croniter.*",
    "daytona.*",
    "deepagents.*",
    "fastmcp.*",
    "jose.*",
    "jsonschema.*",
    "langfuse.*",
    "mcp.*",
    "opensandbox.*",
    "pwdlib.*",
    "slack_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The type-check ratchet. Everything not listed here is checked; these 50 modules
# carried errors when mypy was first introduced and are exempted per-module rather
# than lowering the bar globally, so new and cleaned-up code is protected today.
#
# To clean one up: delete its line, run `uv run mypy app`, fix what it reports.
# Do not add lines — a new module must be clean. See backend-cleanup-todo.md P0-3.
module = [
    "app.agents.core.repository",
    "app.agents.core.service",
    "app.agents.mcp_servers.repository",
    "app.agents.mcp_servers.service",
    "app.agents.router",
    "app.agents.runs.control",
    "app.agents.runs.repository",
    "app.agents.runs.router",
    "app.agents.runs.service",
    "app.agents.runtime",
    "app.agents.sandboxes.repository",
    "app.agents.schemas",
    "app.agents.structured_output",
    "app.agents.subagents.repository",
    "app.agents.subagents.service",
    "app.agents.tool_errors",
    "app.agents.toolset",
    "app.auth.router",
    "app.auth.service",
    "app.auth.tokens.repository",
    "app.database",
    "app.integrations.slack.handlers",
    "app.invites.service",
    "app.main",
    "app.mcp.client.auth",
    "app.mcp.client.connectivity",
    "app.mcp.client.initialize",
    "app.mcp.servers.catalog",
    "app.mcp.servers.repository",
    "app.mcp.servers.service",
    "app.model_providers.catalog",
    "app.model_providers.whitelist",
    "app.sandbox.cloudrun.provider",
    "app.sandbox.cloudrun.snapshots",
    "app.sandbox.daytona.provider",
    "app.sandbox.opensandbox.backend",
    "app.sandbox.opensandbox.provider",
    "app.sandbox.repository",
    "app.tags.repository",
    "app.tags.router",
    "app.tags.service",
    "app.teams.repository",
    "app.teams.router",
    "app.threads.repository",
    "app.threads.service",
    "app.triggers.repository",
    "app.triggers.service",
    "app.users.repository",
    "app.users.router",
    "app.users.service",
]
ignore_errors = true
