services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-auxilia}/auxilia-web:${VERSION:-latest}
    container_name: auxilia-web
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - auxilia-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-auxilia}/auxilia-backend:${VERSION:-latest}
    container_name: auxilia-backend
    ports:
      - "8000:8000"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-auxilia}
      DB_PASSWORD: ${DB_PASSWORD:-auxilia}
      DB_NAME: ${DB_NAME:-auxilia}
      CHECKPOINTER_POOL_MAX_SIZE: ${CHECKPOINTER_POOL_MAX_SIZE:-20}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_CATALOG_URL: ${MCP_CATALOG_URL-https://pub-fee562950db945e0af49322d187f2a02.r2.dev/mcp/catalog.yaml}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      BACKEND_JWT_SECRET_KEY: ${BACKEND_JWT_SECRET_KEY:-change-me-in-production}
      BACKEND_COOKIE_SECURE: ${BACKEND_COOKIE_SECURE:-false}
      BACKEND_ENCRYPTION_SALT: ${BACKEND_ENCRYPTION_SALT:-${MCP_API_KEY_ENCRYPTION_SALT:-changeme}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-auxilia}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-60}
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      # Optional environment fallbacks; credentials saved in Settings take precedence.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      METAAI_API_KEY: ${METAAI_API_KEY:-}
      RUN_WORKER_CONCURRENCY: ${RUN_WORKER_CONCURRENCY:-8}
      RUN_MAX_DURATION_SECONDS: ${RUN_MAX_DURATION_SECONDS:-1800}
      RUN_DISPATCHER_ENABLED: ${RUN_DISPATCHER_ENABLED:-true}
      # OpenSandbox lifetime in minutes. Zero disables automatic expiration.
      OPEN_SANDBOX_TTL_MINUTES: ${OPEN_SANDBOX_TTL_MINUTES:-30}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-100}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-}
      ARTIFACT_S3_ENDPOINT_URL: ${ARTIFACT_S3_ENDPOINT_URL:-}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:-}
      ARTIFACT_S3_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_ACCESS_KEY:-}
      ARTIFACT_S3_SESSION_TOKEN: ${ARTIFACT_S3_SESSION_TOKEN:-}
      ARTIFACT_S3_ADDRESSING_STYLE: ${ARTIFACT_S3_ADDRESSING_STYLE:-auto}
      ARTIFACT_PREFIX: ${ARTIFACT_PREFIX:-auxilia/artifacts}
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-20971520}
      ARTIFACT_HTML_SOURCES: ${ARTIFACT_HTML_SOURCES:-[]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      # DBHub is an internal MCP data plane. The backend owns and reconciles
      # its generated config through the shared volume below.
      DBHUB_ENABLED: ${DBHUB_ENABLED:-true}
      DBHUB_URL: ${DBHUB_URL:-http://auxilia-dbhub:8080}
      DBHUB_AUTH_TOKEN: ${DBHUB_AUTH_TOKEN:?Set DBHUB_AUTH_TOKEN}
      DBHUB_CONFIG_PATH: /var/lib/auxilia/dbhub/dbhub.toml
      DATABASE_FILES_STORAGE_PATH: /var/lib/auxilia/databases
      DATABASE_FILES_RUNTIME_PATH: /var/lib/auxilia/databases
      DATABASE_FILES_MAX_UPLOAD_BYTES: ${DATABASE_FILES_MAX_UPLOAD_BYTES:-1073741824}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Lets the backend reach an Ollama process running on the Docker host
      # on Linux; Docker Desktop already resolves the same hostname.
      - "host.docker.internal:host-gateway"
    volumes:
      - dbhub-config:/var/lib/auxilia/dbhub
      - database-files:/var/lib/auxilia/databases
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - auxilia-network

  dbhub:
    image: bytebase/dbhub:1.5.0
    container_name: auxilia-dbhub
    init: true
    user: "1000:1000"
    environment:
      DBHUB_AUTH_TOKEN: ${DBHUB_AUTH_TOKEN:?Set DBHUB_AUTH_TOKEN}
      DBHUB_ALLOWED_HOSTS: dbhub,dbhub:8080,auxilia-dbhub,auxilia-dbhub:8080,localhost,127.0.0.1
    entrypoint: ["node", "/opt/auxilia/dbhub-reloader.mjs"]
    command:
      [
        "--transport",
        "http",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--config",
        "/tmp/dbhub.toml",
      ]
    volumes:
      - dbhub-config:/input:ro
      - database-files:/var/lib/auxilia/databases
      - ./docker/dbhub-reloader.mjs:/opt/auxilia/dbhub-reloader.mjs:ro
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - auxilia-network

  redis:
    image: redis:7-alpine
    container_name: auxilia-redis
    ports:
      - "6389:6379"
    volumes:
      - redis-data:/data
    # AOF persistence for durability + a memory ceiling so a runaway run can't
    # exhaust host RAM and wedge writes (noeviction). volatile-lru evicts only
    # keys with a TTL (run:* have 1h) and never the no-TTL mcp:* OAuth tokens.
    # Size maxmemory to the host; on GCP Memorystore set the same policy there.
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy volatile-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - auxilia-network

  postgres:
    image: postgres:17
    container_name: auxilia-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-auxilia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auxilia}
      POSTGRES_DB: ${DB_NAME:-auxilia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
      timeout: 3s
    networks:
      - auxilia-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auxilia.ai
      PGADMIN_DEFAULT_PASSWORD: auxilia
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - auxilia-network

networks:
  auxilia-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  pgadmin_data:
    driver: local
  dbhub-config:
    driver: local
  database-files:
    driver: local
