services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-auxilia}/auxilia-web:${VERSION:-latest}
    container_name: auxilia-web
    ports:
      - "3000:3000"
    environment:
      # Backend URL for API proxy (use Docker service name from inside the container)
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - auxilia-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-auxilia}/auxilia-backend:${VERSION:-latest}
    container_name: auxilia-backend
    ports:
      - "8000:8000"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-auxilia}
      DB_PASSWORD: ${DB_PASSWORD:-auxilia}
      DB_NAME: ${DB_NAME:-auxilia}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_JWT_SECRET_KEY: ${BACKEND_JWT_SECRET_KEY:-change-me-in-production}
      BACKEND_COOKIE_SECURE: ${BACKEND_COOKIE_SECURE:-false}
      BACKEND_ENCRYPTION_SALT: ${BACKEND_ENCRYPTION_SALT:-${MCP_API_KEY_ENCRYPTION_SALT:-changeme}}
      # Optional environment fallbacks; credentials saved in Settings take precedence.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      METAAI_API_KEY: ${METAAI_API_KEY:-}
      RUN_WORKER_CONCURRENCY: ${RUN_WORKER_CONCURRENCY:-8}
      RUN_MAX_DURATION_SECONDS: ${RUN_MAX_DURATION_SECONDS:-1800}
      RUN_DISPATCHER_ENABLED: ${RUN_DISPATCHER_ENABLED:-true}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - auxilia-network

  redis:
    image: redis:7-alpine
    container_name: auxilia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # AOF persistence for durability + a memory ceiling so a runaway run can't
    # exhaust host RAM and wedge writes (noeviction). volatile-lru evicts only
    # keys with a TTL (run:* have 1h) and never the no-TTL mcp:* OAuth tokens.
    # Size maxmemory to the host; on GCP Memorystore set the same policy there.
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy volatile-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - auxilia-network

  postgres:
    image: postgres:17
    container_name: auxilia-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-auxilia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auxilia}
      POSTGRES_DB: ${DB_NAME:-auxilia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
      timeout: 3s
    networks:
      - auxilia-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auxilia.ai
      PGADMIN_DEFAULT_PASSWORD: auxilia
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - auxilia-network

networks:
  auxilia-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  pgadmin_data:
    driver: local
