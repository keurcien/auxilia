name: sandbox-gateway CI

on:
  push:
    branches: [main]
    paths: ["sandbox-gateway/**"]
  pull_request:
    paths: ["sandbox-gateway/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "fastapi>=0.115" httpx pytest
      - name: Run tests
        run: pytest -q
