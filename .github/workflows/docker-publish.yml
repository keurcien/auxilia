name: Publish Docker image

on:
  workflow_call:
    inputs:
      component:
        description: "backend or web"
        required: true
        type: string
      version:
        description: "Version tag, e.g. 0.4.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      component:
        description: "backend or web"
        required: true
        type: choice
        options: [backend, web]
      version:
        description: "Version tag, e.g. 0.4.0"
        required: true
        type: string

env:
  IMAGE: keurcien/auxilia-${{ inputs.component }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.component }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.component }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.component }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        # `latest` follows `main`, never a branch. Release-please calls this
        # workflow from `main`, so a release still moves it; a manual dispatch
        # from a feature branch publishes its own tag and nothing else —
        # `docker-compose.yml` defaults to `${VERSION:-latest}`, so tagging it
        # from a branch would hand unreleased code to every plain `compose up`.
        # Derived from the ref rather than an input: a test build must not be
        # one forgotten checkbox away from overwriting the released image.
        env:
          VERSION: ${{ inputs.version }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          # An `if`, not `[ … ] && …`: steps run under `bash -e`, where the
          # test returning 1 on a branch build would fail the step outright.
          if [ "$IS_MAIN" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
