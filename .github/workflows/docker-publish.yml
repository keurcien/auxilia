name: Publish container image

on:
  workflow_call:
    inputs:
      component:
        description: "backend or web"
        required: true
        type: string
      registry:
        description: "dockerhub or ghcr"
        required: true
        type: string
      version:
        description: "Version tag, e.g. 0.4.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      component:
        description: "backend or web"
        required: true
        type: choice
        options: [backend, web]
      registry:
        description: "Container registry"
        required: true
        type: choice
        options: [dockerhub, ghcr]
      version:
        description: "Version tag, e.g. 0.4.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare publishing target
        run: |
          case "$registry" in
            dockerhub) image="keurcien/auxilia-${component}" ;;
            ghcr) image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/auxilia-${component}" ;;
            *) echo "Unsupported registry: $registry" >&2; exit 1 ;;
          esac
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          component: ${{ inputs.component }}
          platform: ${{ matrix.platform }}
          registry: ${{ inputs.registry }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: inputs.registry == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.component }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.registry }}-${{ inputs.component }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ inputs.registry }}-${{ inputs.component }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.registry }}-digests-${{ inputs.component }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Prepare publishing target
        run: |
          case "$registry" in
            dockerhub) image="keurcien/auxilia-${component}" ;;
            ghcr) image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/auxilia-${component}" ;;
            *) echo "Unsupported registry: $registry" >&2; exit 1 ;;
          esac
          echo "IMAGE=$image" >> "$GITHUB_ENV"
        env:
          component: ${{ inputs.component }}
          registry: ${{ inputs.registry }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.registry }}-digests-${{ inputs.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: inputs.registry == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        # `latest` follows `main`, never a branch. Release-please calls this
        # workflow from `main`, so a release still moves it; a manual dispatch
        # from a feature branch publishes its own tag and nothing else —
        # `docker-compose.yml` defaults to `${VERSION:-latest}`, so tagging it
        # from a branch would hand unreleased code to every plain `compose up`.
        # Derived from the ref rather than an input: a test build must not be
        # one forgotten checkbox away from overwriting the released image.
        env:
          VERSION: ${{ inputs.version }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          # An `if`, not `[ … ] && …`: steps run under `bash -e`, where the
          # test returning 1 on a branch build would fail the step outright.
          if [ "$IS_MAIN" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
