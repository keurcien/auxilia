---
# Static analysis targets shipped code. web/tests/ is Playwright tooling
# (demo-video recording, docs screenshots) that runs locally against a dev
# stack with developer-controlled input only — its dynamic fs paths, env-var
# backend URL and overlay templates trip security patterns (path/SSRF/XSS)
# that don't apply to code that is never served or deployed.
# backend/tests/ is pytest code: `assert` is the test mechanism itself, so
# bandit's B101 (assert removed under -O) doesn't apply — tests never run
# optimised, and flagging every assertion drowns real findings.
# web/src/**/*.test.ts(x) are Vitest unit tests: they feed viewers hostile
# fixtures (`<script>` payloads, markup in CSV cells) on purpose, to prove the
# rendering neutralises them — the XSS patterns flag exactly what is under test.
# design/ is the Petrol Mono design handoff: generated, self-contained HTML
# mockups and their support script, kept for reference and never served.
exclude_paths:
  - "web/tests/**"
  - "backend/tests/**"
  - "web/src/**/*.test.ts"
  - "web/src/**/*.test.tsx"
  - "design/**"
